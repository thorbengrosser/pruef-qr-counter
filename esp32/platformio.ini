; PlatformIO project for PRÜF counter ESP32 display
; https://docs.platformio.org/en/latest/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv

; Built-in BLE (Bluedroid). ArduinoJson for API. PNGenc for image encoding.
lib_deps =
    bblanchon/ArduinoJson@^6.21.3

; Build flags - override WIFI_SSID/WIFI_PASS via -D for build
build_flags =
    -DCORE_DEBUG_LEVEL=3
