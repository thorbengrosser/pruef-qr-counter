<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PRÜF QR{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="demo">
  <div class="screen">
    <div class="paper {% block page_class %}{% endblock %}">
      <header class="institutional-header" aria-label="Institution">
        <div class="inst-symbol" aria-hidden="true"></div>
        <div class="inst-text">
          <span class="inst-primary">INSTITUT FÜR QR-CODE-PRÜFUNGEN</span>
          <span class="inst-secondary">Referat Digitale Ordnung</span>
        </div>
      </header>
      {% block content %}{% endblock %}
      <footer class="legal">
        <a href="{{ url_for('main.impressum') }}">Impressum</a>
        <a href="{{ url_for('main.datenschutz') }}">Datenschutz</a>
        <a href="https://github.com/thorbengrosser/pruef-qr-counter/" target="_blank" rel="noopener noreferrer">GitHub</a>
      </footer>
    </div>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
