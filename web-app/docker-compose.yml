# Fixed project name so the volume is always "pruef-qr_pruef-data" no matter
# where you run from (e.g. cd web-app vs docker compose -f web-app/docker-compose.yml).
name: pruef-qr

services:
  pruef-qr:
    build: .
    ports:
      - "5050:5000"
    volumes:
      - pruef-data:/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  pruef-data:
